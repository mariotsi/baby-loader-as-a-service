name: Deploy

# Deploys one commit to Cloudflare Workers (ADR-0009), called by "Deploy to
# production", "Deploy to staging" and "Deploy to preview". The job runs in
# the GitHub environment it deploys to, which records the deployment and
# holds that environment's Cloudflare API token. Every deploy migrates its
# database before the new code goes live, so the code never runs on a schema
# it doesn't know; a migration keeps working with the code still serving.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment that records the deployment and holds its secrets.
        type: string
        required: true
      url:
        description: The deployment's address. Empty for a Preview, which wrangler names.
        type: string
        default: ""
      database:
        description: The D1 database to migrate. Empty for a Preview, which takes one from the pool.
        type: string
        default: ""
      wrangler-config:
        description: The Worker's wrangler config. A Preview writes its own.
        type: string
        default: wrangler.jsonc
      r2-bucket:
        description: Where the website assets go.
        type: string
        required: true
      media-route:
        description: Whose media route bypass to ensure (scripts/ensure-media-route.mjs).
        type: string
        required: true
      preview:
        description: Deploy a Preview of the branch, with a database lent from the pool, instead of the Worker itself.
        type: boolean
        default: false
    outputs:
      url:
        description: Where the deployment serves.
        value: ${{ jobs.deploy.outputs.url }}
      database:
        description: The Preview's pool database. Empty otherwise.
        value: ${{ jobs.deploy.outputs.database }}

env:
  # The account's workers.dev subdomain, under which each Preview gets
  # <preview name>-loading-baby-staging.
  WORKERS_DEV: simone-716.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url || steps.preview.outputs.preview-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Passed through the environment, never interpolated into a script: a
      # branch name is user-controlled input.
      BRANCH: ${{ github.ref_name }}
    outputs:
      # Where wrangler says a Preview is: the E2E wait step fails if that
      # isn't the ROOT_DOMAIN the deploy passed.
      url: ${{ inputs.url || steps.preview.outputs.preview-url }}
      database: ${{ steps.pool.outputs.database }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Keeps the database the branch already holds, with its data, or
      # claims a free one. Fails here, before anything is deployed, when every
      # pool database belongs to another branch.
      - name: Take a database from the Preview pool
        id: pool
        if: inputs.preview
        run: node scripts/preview-pool.mjs claim "$BRANCH"

      # Never committed: binds DB to the pool database alone, so neither the
      # migrations nor the Preview can reach staging's.
      - name: Write the Preview's wrangler config
        if: inputs.preview
        env:
          DATABASE: ${{ steps.pool.outputs.database }}
        run: node scripts/preview-pool.mjs config "$DATABASE" wrangler.preview.json

      # A Preview's database is one of PREVIEW_POOL's, never the branch's.
      - name: Apply D1 migrations to ${{ inputs.database || 'the Preview''s database' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply ${{ inputs.database || steps.pool.outputs.database }} --remote --config ${{ inputs.preview && 'wrangler.preview.json' || inputs.wrangler-config }}

      - run: npm run cf:build

      - name: Upload website assets to R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ inputs.r2-bucket }}
        run: node scripts/upload-website-assets.mjs

      - name: Deploy the Worker
        if: ${{ !inputs.preview }}
        uses: cloudflare/wrangler-action@v4
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config ${{ inputs.wrangler-config }}
          vars: |
            GIT_COMMIT_SHA
            GIT_BRANCH

      # The branch name reaches the Worker through `vars`, as its own
      # argument, never inside the command; the Preview's name is sanitized.
      # The Preview's own host is its root domain, so it serves Sites by path.
      - name: Deploy the Preview
        id: preview
        if: inputs.preview
        uses: cloudflare/wrangler-action@v4
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          ROOT_DOMAIN: ${{ steps.pool.outputs.preview_name }}-loading-baby-staging.${{ env.WORKERS_DEV }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: preview --config wrangler.preview.json --name ${{ steps.pool.outputs.preview_name }}
          vars: |
            GIT_COMMIT_SHA
            GIT_BRANCH
            ROOT_DOMAIN

      # Recreate the media bypass if someone removes it manually in Cloudflare.
      - name: Ensure the media route bypass exists
        env:
          MEDIA_ROUTE: ${{ inputs.media-route }}
        run: node scripts/ensure-media-route.mjs "$MEDIA_ROUTE"

      # Maintains one Preview comment on each pull request.
      - name: Comment the Preview link on the branch's pull requests
        if: inputs.preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
        run: node scripts/preview-comment.mjs ready "$BRANCH" "$SHA" "$DEPLOYMENT_URL"

      # Wrangler's log files hold each Cloudflare API call and its error,
      # which the step's own output leaves out.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: wrangler-logs
          path: ~/.config/.wrangler/logs/
          retention-days: 7
