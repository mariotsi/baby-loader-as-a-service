name: CD

# Deploys staging to the Cloudflare Worker loading-baby-staging and runs the
# Playwright suite (e2e/) against it, on every push to the staging branch
# (ADR-0009). While the migration is built on the cloudflare branch, that
# branch plays staging's part; it becomes staging in #71. Previews and
# production join this workflow in #70.

on:
  push:
    branches: [cloudflare, staging]
  workflow_dispatch:

permissions:
  contents: read

# One staging deploy at a time; a newer push replaces a waiting or running one.
concurrency:
  group: cd-staging
  cancel-in-progress: true

env:
  STAGING_URL: https://staging-loading-baby.fyi

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the staging Worker's API token (CLOUDFLARE_API_TOKEN).
    environment: Preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Before the new code goes live, so it never runs on a schema it
      # doesn't know. A migration keeps working with the code still serving.
      - name: Apply D1 migrations to loading-baby-staging
        run: npx wrangler d1 migrations apply loading-baby-staging --remote

      - run: npm run cf:build

      - name: Deploy the staging Worker
        run: >-
          npx wrangler deploy
          --var GIT_COMMIT_SHA:${{ github.sha }}
          --var GIT_BRANCH:${{ github.ref_name }}

  # The rulesets "Require E2E on main" and "Require CI and E2E on staging"
  # require a check named e2e from GitHub Actions: keep this job's name.
  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the Access service token and the staging Worker's API token, which
    # the data script uses to write fixtures to staging's D1.
    environment: Preview
    # Playwright's image ships its browsers and their system dependencies.
    # Its version must equal @playwright/test in package.json, which CI
    # checks (scripts/check-playwright-image.mjs).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # The runner's user, which owns the mounted workspace and home.
      options: --user 1001
    env:
      CI: true
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Gets the suite through Cloudflare Access, which guards staging.
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      # The image's Node (24) runs the suite.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci

      - name: Wait until staging serves this commit
        env:
          DEPLOYMENT_URL: ${{ env.STAGING_URL }}
          COMMIT: ${{ github.sha }}
        run: node scripts/wait-for-deployment.mjs >> "$GITHUB_ENV"

      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Staging only: the cloudflare branch never promotes.
  promote:
    needs: e2e
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One push to main at a time. The push is a fast-forward, so main never
    # moves back to an older commit whichever run comes last.
    concurrency:
      group: promote-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Write deploy key, the only bypass actor of the ruleset that
          # restricts updates to main.
          ssh-key: ${{ secrets.PROMOTE_DEPLOY_KEY }}

      - name: Fast-forward main to this commit
        env:
          SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "main already contains $SHA"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "$SHA"; then
            echo "::error::main has commits $SHA lacks: merge main into staging first"
            exit 1
          fi
          git push origin "$SHA:refs/heads/main"
