name: Drop preview database

# Once a branch's pull request closes or the branch is deleted, deletes its
# Preview and releases the Preview pool database it held: every table
# dropped, the migrations table included, and the database free for the next
# branch (scripts/preview-pool.mjs). Only pool databases are ever touched.
# When both events happen, the second run finds nothing left to remove.

on:
  pull_request:
    types: [closed]
  delete:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  drop:
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds the staging Worker's API token, which Previews belong to.
    environment: Preview
    # Never at the same time as a deploy of the same branch.
    concurrency:
      group: cd-${{ github.event_name == 'pull_request' && github.head_ref || github.event.ref }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Passed through the environment, never interpolated into the scripts:
      # a branch name is user-controlled input.
      BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.event.ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Name the branch's Preview
        id: preview
        run: |
          name=$(node --input-type=module -e "import { previewName } from './src/lib/dbName.ts'; console.log(previewName(process.argv[1]))" "$BRANCH")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # Fails when the branch never had a Preview, or the other event of the
      # pair already deleted it: the database is released either way.
      - name: Delete the branch's Preview
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: preview delete --name ${{ steps.preview.outputs.name }} --skip-confirmation
      - name: Release the branch's pool database
        run: node scripts/preview-pool.mjs release "$BRANCH"
      - name: Say so on the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKERS_DEV: simone-716.workers.dev
        run: node scripts/preview-comment.mjs deleted "$BRANCH"
