name: CI

# Checks every pull request into staging: that cd.yml's Playwright image
# matches @playwright/test, types, lint and unit tests (src/lib/*.test.ts,
# which start their own MongoDB with mongodb-memory-server). The Playwright
# suite runs on the pull request's preview deployment (cd.yml).

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Check the Playwright image matches package.json
        run: node scripts/check-playwright-image.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
