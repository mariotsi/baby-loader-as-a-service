name: CI

# Checks every pull request into staging, and into cloudflare (the branch
# that carries the move to Cloudflare Workers, ADR-0009): that the
# workflows' Playwright images match @playwright/test, types, lint and
# formatting (Biome), unit tests (src/**/*.test.ts, some on an in-memory D1),
# the Cloudflare Worker build, and every Storybook story rendered in
# Chromium with no axe violation. The Playwright suite runs on the pull request's
# preview deployment (cd.yml).

on:
  pull_request:
    branches: [staging, cloudflare]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check the Playwright image matches package.json
        run: node scripts/check-playwright-image.mjs
      - run: npm ci
      - run: npm run typecheck
      - name: Lint and format check
        run: npx biome ci
      - run: npm test
      - name: Build the Cloudflare Worker
        run: npm run cf:build

  # Renders every story in Chromium and fails on any axe violation, in every
  # Palette (vitest.config.ts, the "storybook" project).
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's image ships Chromium and its system dependencies. Its
    # version must equal @playwright/test in package.json, which the ci job
    # checks (scripts/check-playwright-image.mjs).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # The runner's user, which owns the mounted workspace and home.
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      # The image's Node (24) runs the tests.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:storybook
