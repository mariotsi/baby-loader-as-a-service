name: E2E

# Runs the Playwright suite (e2e/) against every deployment of the Vercel
# project baby-loader-staging once Vercel reports it ready: its previews,
# whose check lands on the pull request's commit, and staging, its
# production branch. The production project, baby-loader-as-a-service, is
# never tested: the job filters it out, and the suite refuses a deployment
# that reports production (e2e/global-setup.ts).

on:
  deployment_status:

# Vercel's deployment events carry no branch: staging runs one at a time,
# the newest deployment winning, and previews are grouped per commit.
concurrency:
  group: e2e-${{ startsWith(github.event.deployment.environment, 'Production') && 'staging' || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event.deployment_status.state == 'success' &&
      endsWith(github.event.deployment.environment, 'baby-loader-staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      # Staging and preview databases both live on the non-production cluster.
      E2E_MONGODB_URI: ${{ secrets.PREVIEW_MONGODB_URI }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # baby-loader-staging's Protection Bypass for Automation: its vercel.app
      # URLs sit behind Deployment Protection, staging.loading.baby does not.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Find where the deployment serves this commit
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          COMMIT: ${{ github.sha }}
        run: node scripts/wait-for-deployment.mjs >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
