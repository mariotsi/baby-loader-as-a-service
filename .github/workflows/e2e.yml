name: E2E

# Runs the Playwright suite (e2e/) against a live deployment:
# - every preview deployment of this repository's Vercel project, once Vercel
#   reports it ready, which puts the check on the pull request's commit;
# - staging, on every push to the `staging` branch, once staging serves it.
# Production is never tested: the suite refuses a deployment that reports it
# (e2e/global-setup.ts).

on:
  deployment_status:
  push:
    branches: [staging]

# Staging runs one at a time, the newest push winning. Vercel's deployment
# events carry no branch, so preview runs are grouped per commit.
concurrency:
  group: e2e-${{ github.event_name == 'push' && 'staging' || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name == 'push' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      # Staging and preview databases both live on the non-production cluster.
      E2E_MONGODB_URI: ${{ secrets.PREVIEW_MONGODB_URI }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Only preview deployments sit behind Vercel's Deployment Protection.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ github.event_name == 'deployment_status' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Wait until the deployment serves this commit
        env:
          DEPLOYMENT_URL: ${{ github.event_name == 'push' && 'https://staging.loading.baby' || github.event.deployment_status.environment_url }}
          COMMIT: ${{ github.sha }}
        run: node scripts/wait-for-deployment.mjs >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
