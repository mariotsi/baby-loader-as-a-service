# Local MongoDB for `npm run dev`, `npm run seed` and `npm run e2e`.
# Start it with `npm run db:up`; data survives restarts in the "mongo-data" volume.
name: waitingpages
services:
  mongo:
    image: mongo:7
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mongo-data:
